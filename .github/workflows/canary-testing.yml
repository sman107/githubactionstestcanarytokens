name: Canary testing

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/canary-testing.yml'
jobs:
  testing-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        id: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy canary
        uses: sman107/githubactionstestcanarytokens/.github/actions/canary-tokens-deploy@main
        with:
          aws-credentials: ${{ secrets.CANARY_AWS_CREDENTIALS }}
          vault-token: ${{ secrets.CANARY_VAULT_TOKEN }}
      - name: Check if exists
        run: |
          sh -c "ls -la ~/.aws/credentials; ls -la ~/.vault-token; pwd; id"
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --log-level=2 --results=verified,unknown